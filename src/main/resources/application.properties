spring.application.name=health_tracking_system

# Local MySQL by default. On a host (e.g. Render) set DB_URL, DB_USERNAME and DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/health_tracking_system?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

server.port=${PORT:8081}
# Trust the host's HTTPS proxy so redirects and links stay on https.
server.forward-headers-strategy=framework
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

app.bootstrap.admin.email=${ADMIN_EMAIL:}
app.bootstrap.admin.password=${ADMIN_PASSWORD:}
app.bootstrap.admin.first-name=${ADMIN_FIRST_NAME:System}
app.bootstrap.admin.last-name=${ADMIN_LAST_NAME:Administrator}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB