<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet"
          href="/css/healthtrack-ui.css"
          data-th-href="@{/css/healthtrack-ui.css}">
</head>
<body class="healthtrack-ui admin-ui">
<header class="healthtrack-global-header">
    <div class="healthtrack-global-inner">
        <a class="healthtrack-global-brand"
           href="/dashboard"
           data-th-href="@{/dashboard}">
            <span class="healthtrack-global-mark">
                <img src="/images/heart-pulse.svg"
                     data-th-src="@{/images/heart-pulse.svg}"
                     alt="">
            </span>
            <span>
                <span class="healthtrack-global-name">HealthTrack</span>
                <span class="healthtrack-global-tagline">Your health, clearly</span>
            </span>
        </a>
        <span class="healthtrack-global-section">Administration</span>
    </div>
</header>
<div class="healthtrack-page-shell">

<h1>Administrator Dashboard</h1>

<p>
    Welcome,
    <span th:text="${currentUser.fullName}">Administrator</span>
</p>

<p>
    Role:
    <span th:text="${currentUser.role.displayName}">Administrator</span>
</p>

<p>
    <a th:href="@{/profile}">My Profile</a>
</p>

<form th:action="@{/logout}" method="post">
    <button type="submit">Logout</button>
</form>

</div>
</body>
</html>
