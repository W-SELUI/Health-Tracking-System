<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Administrator Dashboard</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #eef2f7;
            color: #0d2d52;
            margin: 0;
        }

        header {
            background: #dcecf9;
            padding: 35px 6%;
        }

        main {
            width: 90%;
            max-width: 1100px;
            margin: 35px auto;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 14px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            text-align: center;
        }

        .card h3 {
            margin-bottom: 10px;
        }

        .value {
            font-size: 34px;
            font-weight: bold;
            color: #1565a9;
        }

        .menu a {
            display: block;
            background: white;
            padding: 16px;
            margin-bottom: 12px;
            border-radius: 10px;
            text-decoration: none;
            color: #0d2d52;
            font-weight: 600;
        }

        .menu a:hover {
            background: #dcecf9;
        }

        button {
            margin-top: 20px;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #344f6f;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        @media (max-width: 700px) {
            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Administrator Dashboard</h1>
    <p>Health Tracking System Administration</p>
</header>

<main>

    <div class="stats">

        <div class="card">
            <h3>Total Users</h3>
            <div class="value"
                 th:text="${totalUsers}">
                0
            </div>
        </div>

        <div class="card">
            <h3>Patients</h3>
            <div class="value"
                 th:text="${totalPatients}">
                0
            </div>
        </div>

        <div class="card">
            <h3>Providers</h3>
            <div class="value"
                 th:text="${totalProviders}">
                0
            </div>
        </div>

        <div class="card">
            <h3>Enabled Users</h3>
            <div class="value"
                 th:text="${enabledUsers}">
                0
            </div>
        </div>

        <div class="card">
            <h3>Disabled Users</h3>
            <div class="value"
                 th:text="${disabledUsers}">
                0
            </div>
        </div>

        <div class="card">
            <h3>Pending Verifications</h3>
            <div class="value"
                 th:text="${pendingVerifications}">
                0
            </div>
        </div>

    </div>

    <div class="menu">

        <a th:href="@{/admin/users}">
            Manage Users
        </a>

        <a th:href="@{/admin/providers}">
            Manage Providers
        </a>

        <a th:href="@{/admin/provider-verifications}">
            Provider Licence Verifications
        </a>

        <a th:href="@{/profile}">
            My Profile
        </a>

    </div>

    <form th:action="@{/logout}"
          method="post">

        <button type="submit">
            Logout
        </button>

    </form>

</main>

</body>
</html>
