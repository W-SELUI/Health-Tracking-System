<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet"
          href="/css/healthtrack-ui.css"
          data-th-href="@{/css/healthtrack-ui.css}">
</head>
<body class="healthtrack-ui admin-ui healthtrack-app-layout">
<div data-th-replace="~{fragments/navigation :: navigation('dashboard', 'Dashboard')}"></div>
<div class="healthtrack-page-shell">

<h1>Administrator Dashboard</h1>

<p class="ht-page-intro">
    Welcome, <strong th:text="${currentUser.fullName}">Administrator</strong>.
    Review accounts and provider verification requests from one place.
</p>

<section class="ht-admin-stats" aria-label="Account statistics">
    <article class="ht-admin-stat">
        <span>Total users</span>
        <strong th:text="${totalUsers}">0</strong>
    </article>
    <article class="ht-admin-stat">
        <span>Patients</span>
        <strong th:text="${totalPatients}">0</strong>
    </article>
    <article class="ht-admin-stat">
        <span>Providers</span>
        <strong th:text="${totalProviders}">0</strong>
    </article>
    <article class="ht-admin-stat">
        <span>Enabled users</span>
        <strong th:text="${enabledUsers}">0</strong>
    </article>
    <article class="ht-admin-stat">
        <span>Disabled users</span>
        <strong th:text="${disabledUsers}">0</strong>
    </article>
    <article class="ht-admin-stat">
        <span>Pending verifications</span>
        <strong th:text="${pendingVerifications}">0</strong>
    </article>
</section>

<nav class="ht-admin-menu" aria-label="Administration tools">
    <a th:href="@{/admin/users}">Manage users</a>
    <a th:href="@{/admin/providers}">Manage providers</a>
    <a th:href="@{/admin/provider-verifications}">Provider licence verifications</a>
    <a th:href="@{/profile}">My profile</a>
</nav>

<form th:action="@{/logout}" method="post">
    <button type="submit">Logout</button>
</form>

</div>
</body>
</html>
