<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Provider Dashboard</title>

    <link rel="stylesheet"
          href="/css/app.css"
          data-th-href="@{/css/app.css}">
</head>
<body>

<h1>Healthcare Provider Dashboard</h1>

<p>
    Welcome,
    <span data-th-text="${currentUser.fullName}">Provider</span>
</p>

<p>
    Role:
    <span data-th-text="${currentUser.role.displayName}">
        Healthcare Provider
    </span>
</p>

<p>
    <a href="/provider/patients"
       data-th-href="@{/provider/patients}">
        View Patients with Active Consent
    </a>
</p>

<form action="/logout"
      data-th-action="@{/logout}"
      method="post">
    <button type="submit">Logout</button>
</form>

</body>
</html>
