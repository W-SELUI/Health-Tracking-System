<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Provider Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<h1>Healthcare Provider Dashboard</h1>

<p>
    Welcome,
    <span th:text="${currentUser.fullName}">
        Provider
    </span>
</p>

<p>
    Role:
    <span th:text="${currentUser.role.displayName}">
        Healthcare Provider
    </span>
</p>

<hr>

<h2>Provider Menu</h2>

<p>
    <a th:href="@{/provider/appointments}">
        Appointment Requests
    </a>
</p>

<p>
    <a th:href="@{/profile}">
        My Profile
    </a>
</p>

<form th:action="@{/logout}" method="post">
    <button type="submit">
        Logout
    </button>
</form>

</body>

</html>
