<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Patient Dashboard</title>

    <link rel="stylesheet"
          href="/css/app.css"
          data-th-href="@{/css/app.css}">
</head>

<body>

<h1>Patient Dashboard</h1>

<p>
    Welcome,
    <span data-th-text="${currentUser.fullName}">Patient</span>
</p>

<p>
    Role:
    <span data-th-text="${currentUser.role.displayName}">Patient</span>
</p>

<p>
    <a href="/patient/consents"
       data-th-href="@{/patient/consents}">
        Manage Provider Access
    </a>
</p>

<p>
    <a href="/messages"
       data-th-href="@{/messages}">
        Messages
    </a>
</p>

<form action="/logout"
      data-th-action="@{/logout}"
      method="post">
    <button type="submit">Logout</button>
</form>

</body>
</html>
