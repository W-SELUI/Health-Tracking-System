<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Patient Dashboard</title>
</head>
<body>

<h1>Patient Dashboard</h1>

<p>
    Welcome,
    <span th:text="${currentUser.fullName}">Patient</span>
</p>

<p>
    Role:
    <span th:text="${currentUser.role.displayName}">Patient</span>
</p>

<form th:action="@{/logout}" method="post">
    <button type="submit">Logout</button>
</form>

</body>
</html>
