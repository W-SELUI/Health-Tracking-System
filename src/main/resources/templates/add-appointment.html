<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Appointment</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Segoe UI', Arial, sans-serif;
            background:#f4f6f9;
        }

        .header{
            background:linear-gradient(135deg,#1e3c72,#2a5298);
            color:white;
            text-align:center;
            padding:35px;
            box-shadow:0 3px 10px rgba(0,0,0,0.15);
        }

        .header h1{
            font-size:42px;
            margin-bottom:10px;
        }

        .header p{
            font-size:18px;
            opacity:0.9;
        }

        .container{
            width:550px;
            margin:40px auto;
            background:white;
            padding:35px;
            border-radius:15px;
            box-shadow:0 4px 15px rgba(0,0,0,0.1);
        }

        h2{
            text-align:center;
            color:#2c3e50;
            margin-bottom:25px;
        }

        label{
            display:block;
            font-weight:bold;
            margin-top:15px;
            margin-bottom:8px;
            color:#2c3e50;
        }

        input, select{
            width:100%;
            padding:12px;
            border:1px solid #dcdcdc;
            border-radius:8px;
            font-size:15px;
        }

        input:focus,
        select:focus{
            outline:none;
            border-color:#3498db;
            box-shadow:0 0 5px rgba(52,152,219,0.3);
        }

        .save-btn{
            width:100%;
            margin-top:25px;
            padding:14px;
            background:#28a745;
            color:white;
            border:none;
            border-radius:8px;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
        }

        .save-btn:hover{
            background:#218838;
        }

        .back-btn{
            display:block;
            text-align:center;
            margin-top:15px;
            padding:12px;
            background:#2c3e50;
            color:white;
            text-decoration:none;
            border-radius:8px;
            font-weight:bold;
        }

        .back-btn:hover{
            background:#1a252f;
        }

    </style>
</head>

<body>

<div class="header">
    <h1>📅 Appointment Management</h1>
    <p>Schedule a new patient appointment</p>
</div>

<div class="container">

    <h2>Add Appointment</h2>

    <form th:action="@{/appointments/save}" method="post">

        <label>Doctor Name</label>
        <input type="text"
               name="doctorName"
               required>

        <label>Location</label>
        <input type="text"
               name="location"
               required>

        <label>Date & Time</label>
        <input type="datetime-local"
               name="appointmentDateTime"
               required>

        <label>Status</label>

        <select name="status">

            <option
                    th:each="status : ${statuses}"
                    th:value="${status}"
                    th:text="${status}">
            </option>

        </select>

        <button type="submit" class="save-btn">
            Save Appointment
        </button>

    </form>

    <a href="/appointments" class="back-btn">
        Back to Appointment List
    </a>

</div>

</body>
</html>
