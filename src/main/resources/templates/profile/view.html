<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Profile</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet"
          href="/css/healthtrack-ui.css"
          data-th-href="@{/css/healthtrack-ui.css}">
</head>
<body class="healthtrack-ui profile-ui healthtrack-app-layout">
<div data-th-replace="~{fragments/navigation :: navigation('profile', 'My profile')}"></div>
<div class="healthtrack-page-shell">

<h1>My Profile</h1>

<p class="page-intro">
    Review your account details and keep your personal information up to date.
</p>

<p class="alert-success" th:if="${param.updated}">
    Profile updated successfully.
</p>

<section class="profile-card" aria-label="Profile details">
    <div class="profile-grid">
        <div class="profile-field">
        <span class="profile-label">First Name</span>
        <span th:text="${currentUser.firstName}">First Name</span>
        </div>

        <div class="profile-field">
        <span class="profile-label">Last Name</span>
        <span th:text="${currentUser.lastName}">Last Name</span>
        </div>

        <div class="profile-field">
        <span class="profile-label">Email</span>
        <span th:text="${currentUser.email}">email@example.com</span>
        </div>

        <div class="profile-field">
        <span class="profile-label">Role</span>
        <span th:text="${currentUser.role.displayName}">Role</span>
        </div>
    </div>

    <div class="profile-actions">
        <a class="button" th:href="@{/profile/edit}">Edit Profile</a>
        <a class="button button-secondary" th:href="@{/dashboard}">Back to Dashboard</a>

        <form class="compact-form" th:action="@{/logout}" method="post">
            <button class="button button-quiet" type="submit">Logout</button>
        </form>
    </div>
</section>

</div>
</body>
</html>
