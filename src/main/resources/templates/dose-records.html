
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dose Records | Health Tracking System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #edf2f8;
            color: #12345a;
            min-height: 100vh;
        }

        .header {
            background: #dcecf9;
            padding: 35px 5.5%;
            border-bottom: 1px solid #d1e2f1;
        }

        .header h1 {
            margin-bottom: 8px;
            font-size: 38px;
            font-weight: 750;
            color: #12345a;
        }

        .header p {
            font-size: 17px;
            color: #31577e;
        }

        .container {
            max-width: 1450px;
            margin: 35px auto;
            padding: 0 25px;
        }

        .dashboard-link {
            margin-bottom: 24px;
        }

        .dashboard-link a {
            display: inline-flex;
            align-items: center;
            background: #344f6f;
            color: #ffffff;
            text-decoration: none;
            font-size: 15px;
            font-weight: 650;
            padding: 12px 18px;
            border-radius: 8px;
            transition: background 0.2s ease;
        }

        .dashboard-link a:hover {
            background: #293f59;
        }

        .card {
            background: #ffffff;
            border-radius: 18px;
            padding: 30px;
            margin-bottom: 26px;
            box-shadow: 0 5px 20px rgba(28, 55, 85, 0.10);
        }

        h2 {
            margin: 0;
            font-size: 27px;
            color: #12345a;
        }

        .top-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            margin: 25px 0;
        }

        .stat-card {
            background: #f5f9fd;
            padding: 25px;
            border-radius: 16px;
            min-width: 260px;
        }

        .stat-card h3 {
            margin-bottom: 12px;
            color: #12345a;
            font-size: 18px;
        }

        .count {
            font-size: 42px;
            font-weight: bold;
            color: #1769aa;
            overflow-wrap: anywhere;
        }

        /* General buttons */
        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 11px;
            background: #1769aa;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
            font-weight: 650;
            text-align: center;
            white-space: nowrap;
            transition: background 0.2s ease;
        }

        .button:hover {
            background: #12558b;
        }

        /* Bigger Add Dose Record button */
        .add-dose-button {
            padding: 15px 24px;
            font-size: 16px;
            min-height: 52px;
            border-radius: 8px;
        }

        /* Dark blue-grey buttons */
        .delete-button,
        .back-button {
            background: #344f6f;
            color: #ffffff;
        }

        .delete-button:hover,
        .back-button:hover {
            background: #293f59;
        }

        /* Table container */
        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            border: 1px solid #dce4ee;
            border-radius: 12px;
        }

        /* Five evenly spaced columns */
        table {
            width: 100%;
            min-width: 700px;
            table-layout: fixed;
            border-collapse: collapse;
            background: #ffffff;
        }

        thead {
            background: #dce7f3;
        }

        th,
        td {
            width: 20%;
            padding: 14px 12px;
            border-bottom: 1px solid #dce4ee;
            text-align: center;
            vertical-align: middle;
            white-space: nowrap;
        }

        th {
            color: #12345a;
            font-weight: 700;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody tr:hover {
            background: #f6f9fd;
        }

        /* Blue status badges */
        .status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            background: #e8f0fe;
            color: #1769aa;
            font-weight: 700;
            font-size: 12px;
        }

        /* Smaller Edit and Delete buttons */
        .actions {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }

        .actions form {
            margin: 0;
        }

        .actions .button {
            padding: 7px 10px;
            font-size: 12px;
        }

        .empty {
            padding: 25px;
            text-align: center;
            color: #64748b;
            white-space: normal;
        }

        .bottom {
            display: flex;
            justify-content: center;
            margin-top: 28px;
        }

        .bottom .button {
            padding: 14px 24px;
            font-size: 14px;
        }

        @media (max-width: 650px) {
            .header {
                padding: 28px 22px;
            }

            .header h1 {
                font-size: 29px;
            }

            .container {
                margin: 24px auto;
                padding: 0 14px;
            }

            .card {
                padding: 18px;
            }

            h2 {
                font-size: 23px;
            }

            .top-section {
                align-items: stretch;
                flex-direction: column;
            }

            .stat-card {
                min-width: 0;
                width: 100%;
            }

            th,
            td {
                padding: 12px 9px;
            }

            .actions {
                gap: 5px;
            }

            .actions .button {
                padding: 7px 8px;
                font-size: 11px;
            }

            .add-dose-button {
                padding: 13px 18px;
                font-size: 15px;
                min-height: 46px;
            }
        }
    </style>
    <link rel="stylesheet"
          href="/css/healthtrack-ui.css"
          data-th-href="@{/css/healthtrack-ui.css}">
</head>

<body class="healthtrack-ui medication-ui healthtrack-app-layout">
<div data-th-replace="~{fragments/navigation :: navigation('medication', 'Dose records')}"></div>
<div class="healthtrack-page-shell">

<header class="header">
    <h1>Health Tracking System</h1>
    <p>Dose Record Management</p>
</header>

<main class="container">

    <div class="dashboard-link">
        <a th:href="@{/medication-dashboard}">
            &larr; Back to Medication Dashboard
        </a>
    </div>

    <section class="card">

        <h2>📝 Dose Records</h2>

        <div class="top-section">

            <div class="stat-card">
                <h3>Total Dose Records</h3>
                <p class="count"
                   th:text="${#lists.size(doseRecords)}">0</p>
            </div>

            <div>
                <a class="button add-dose-button"
                   th:href="@{/dose-records/add}">
                    + Add Dose Record
                </a>
            </div>

        </div>

        <div class="table-wrapper">
            <table>

                <thead>
                <tr>
                    <th>ID</th>
                    <th>Dose Date</th>
                    <th>Status</th>
                    <th>Edit</th>
                    <th>Delete</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="record : ${doseRecords}">

                    <td th:text="${record.id}">1</td>

                    <td th:text="${record.doseDate}">2026-10-09</td>

                    <td>
                        <span class="status"
                              th:text="${record.status}">
                            TAKEN
                        </span>
                    </td>

                    <td>
                        <a class="button"
                           th:href="@{/dose-records/edit/{id}(id=${record.id})}">
                            Edit
                        </a>
                    </td>

                    <td>
                        <form
                            th:action="@{/dose-records/delete/{id}(id=${record.id})}"
                            method="post"
                            onsubmit="return confirm('Are you sure you want to delete this dose record?');">

                            <button class="button delete-button" type="submit">
                                Delete
                            </button>
                        </form>
                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(doseRecords)}">
                    <td colspan="5" class="empty">
                        No dose records found. Click Add Dose Record to create one.
                    </td>
                </tr>

                </tbody>
            </table>
        </div>

    </section>

    <div class="bottom">
        <a class="button back-button"
           th:href="@{/medication-dashboard}">
            &larr; Back to Medication Dashboard
        </a>
    </div>

</main>

</div>
</body>
</html>
