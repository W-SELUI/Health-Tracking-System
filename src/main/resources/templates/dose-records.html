<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dose Records</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #eef2f7;
            color: #0d2d52;
        }

        .header {
            background: #dcecf9;
            padding: 35px 6%;
            border-bottom: 1px solid #d3e1ef;
        }

        .header h1 {
            font-size: 42px;
            margin-bottom: 10px;
            color: #0d2d52;
        }

        .header p {
            font-size: 18px;
            color: #183b63;
        }

        .container {
            width: 88%;
            max-width: 1400px;
            margin: 40px auto;
            background: white;
            padding: 40px;
            border-radius: 22px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .dashboard-link {
            margin-bottom: 25px;
        }

        .dashboard-link a {
            display: inline-block;
            background: #344F6F;
            color: white;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            padding: 12px 20px;
            border-radius: 8px;
            transition: background 0.3s ease;
        }

        .dashboard-link a:hover {
            background: #293F59;
        }

        h2 {
            font-size: 34px;
            color: #0d2d52;
            margin-bottom: 30px;
        }

        .top-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 35px;
        }

        .stat-card {
            background: #f5f9fd;
            padding: 25px;
            border-radius: 16px;
            min-width: 260px;
        }

        .stat-card h3 {
            margin-bottom: 12px;
            color: #0d2d52;
            font-size: 18px;
        }

        .count {
            font-size: 42px;
            font-weight: bold;
            color: #1565a9;
            overflow-wrap: anywhere;
        }

        .button {
            display: inline-block;
            padding: 12px 20px;
            background: #1565a9;
            color: white;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            text-align: center;
            transition: background 0.3s ease;
        }

        .button:hover {
            background: #0f4d84;
        }

        /* Dark blue-grey buttons */
        .delete-button,
        .back-button {
            background: #344F6F;
            color: white;
        }

        .delete-button:hover,
        .back-button:hover {
            background: #293F59;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            border: 1px solid #d7e2ef;
            border-radius: 15px;
        }

        table {
            width: 100%;
            min-width: 700px;
            border-collapse: collapse;
        }

        th {
            background: #dce7f2;
            color: #0d2d52;
            padding: 20px 14px;
            text-align: center;
        }

        td {
            padding: 15px 14px;
            border-bottom: 1px solid #d7e2ef;
            text-align: center;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody tr:hover {
            background: #f7fbff;
        }

        .status {
            font-weight: bold;
        }

        .taken {
            color: #1769aa;
        }

        .missed {
            color: #354b60;
        }

        .skipped {
            color: #65758b;
        }

        .empty {
            padding: 30px;
            text-align: center;
            color: #7f8c8d;
            font-style: italic;
        }

        .bottom {
            text-align: center;
            margin-top: 35px;
        }

        @media (max-width: 700px) {
            .header {
                padding: 30px 6%;
            }

            .header h1 {
                font-size: 32px;
            }

            .container {
                width: 94%;
                margin: 25px auto;
                padding: 22px;
            }

            h2 {
                font-size: 28px;
            }

            .top-section {
                align-items: stretch;
                flex-direction: column;
            }

            .stat-card {
                min-width: 0;
                width: 100%;
            }

            .button {
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Health Tracking System</h1>
        <p>Dose Record Management</p>
    </div>

    <div class="container">

        <!-- Back to Medication Dashboard -->
        <div class="dashboard-link">
            <a th:href="@{/medication-dashboard}">
                &larr; Back to Medication Dashboard
            </a>
        </div>

        <h2>📝 Dose Records</h2>

        <div class="top-section">

            <div class="stat-card">
                <h3>Total Dose Records</h3>
                <p class="count"
                   th:text="${#lists.size(doseRecords)}">0</p>
            </div>

            <div>
                <a class="button" th:href="@{/dose-records/add}">
                    + Add Dose Record
                </a>
            </div>

        </div>

        <div class="table-wrapper">
            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Dose Date</th>
                        <th>Status</th>
                        <th>Edit</th>
                        <th>Delete</th>
                    </tr>
                </thead>

                <tbody>

                    <tr th:each="record : ${doseRecords}">

                        <td th:text="${record.id}">1</td>

                        <td th:text="${record.doseDate}">2026-10-09</td>

                        <td>
                            <span class="status"
                                  th:classappend="${record.status != null ? ' ' + #strings.toLowerCase(record.status.name()) : ''}"
                                  th:text="${record.status}">
                                TAKEN
                            </span>
                        </td>

                        <td>
                            <a class="button"
                               th:href="@{/dose-records/edit/{id}(id=${record.id})}">
                                Edit
                            </a>
                        </td>

                        <td>
                            <form
                                th:action="@{/dose-records/delete/{id}(id=${record.id})}"
                                method="post"
                                style="display:inline;"
                                onsubmit="return confirm('Are you sure you want to delete this dose record?');">

                                <button class="button delete-button" type="submit">
                                    Delete
                                </button>
                            </form>
                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(doseRecords)}">
                        <td colspan="5" class="empty">
                            No dose records found. Click Add Dose Record to create one.
                        </td>
                    </tr>

                </tbody>
            </table>
        </div>

        <!-- Bottom dashboard button -->
        <div class="bottom">
            <a class="button back-button"
               th:href="@{/medication-dashboard}">
                &larr; Back to Medication Dashboard
            </a>
        </div>

    </div>

</body>
</html>
