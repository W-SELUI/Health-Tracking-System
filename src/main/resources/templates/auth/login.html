<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet"
          href="/css/healthtrack-ui.css"
          data-th-href="@{/css/healthtrack-ui.css}">
</head>
<body class="healthtrack-ui auth-ui">
<header class="healthtrack-global-header">
    <div class="healthtrack-global-inner">
        <a class="healthtrack-global-brand"
           href="/dashboard"
           data-th-href="@{/dashboard}">
            <span class="healthtrack-global-mark">
                <img src="/images/heart-pulse.svg"
                     data-th-src="@{/images/heart-pulse.svg}"
                     alt="">
            </span>
            <span>
                <span class="healthtrack-global-name">HealthTrack</span>
                <span class="healthtrack-global-tagline">Your health, clearly</span>
            </span>
        </a>
        <span class="healthtrack-global-section">Secure access</span>
    </div>
</header>
<div class="healthtrack-page-shell">

<h1>Login</h1>

<p th:if="${param.registered}">
    Registration successful. You can now log in.
</p>

<p th:if="${param.error}">
    Invalid email or password.
</p>

<p th:if="${param.logout}">
    You have been logged out.
</p>

<form th:action="@{/login}" method="post">

    <div>
        <label for="username">Email</label>
        <input
                type="email"
                id="username"
                name="username"
                required>
    </div>

    <div>
        <label for="password">Password</label>
        <input
                type="password"
                id="password"
                name="password"
                required>
    </div>

    <button type="submit">Login</button>

</form>

<p>
    Don't have an account?
    <a th:href="@{/register}">Register</a>
</p>

</div>
</body>
</html>
