<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
</head>
<body>

<h1>Create Account</h1>

<form
        th:action="@{/register}"
        th:object="${registrationRequest}"
        method="post">

    <div>
        <label for="firstName">First Name</label>
        <input
                type="text"
                id="firstName"
                th:field="*{firstName}">
        <p th:if="${#fields.hasErrors('firstName')}"
           th:errors="*{firstName}"></p>
    </div>

    <div>
        <label for="lastName">Last Name</label>
        <input
                type="text"
                id="lastName"
                th:field="*{lastName}">
        <p th:if="${#fields.hasErrors('lastName')}"
           th:errors="*{lastName}"></p>
    </div>

    <div>
        <label for="email">Email</label>
        <input
                type="email"
                id="email"
                th:field="*{email}">
        <p th:if="${#fields.hasErrors('email')}"
           th:errors="*{email}"></p>
    </div>

    <div>
        <label for="password">Password</label>
        <input
                type="password"
                id="password"
                th:field="*{password}">
        <p th:if="${#fields.hasErrors('password')}"
           th:errors="*{password}"></p>
    </div>

    <div>
        <label for="confirmPassword">Confirm Password</label>
        <input
                type="password"
                id="confirmPassword"
                th:field="*{confirmPassword}">
        <p th:if="${#fields.hasErrors('confirmPassword')}"
           th:errors="*{confirmPassword}"></p>
    </div>

    <div>
        <label for="role">Account Type</label>

        <select id="role" th:field="*{role}">
            <option value="">Select account type</option>

            <option
                    th:each="roleOption : ${registrationRoles}"
                    th:value="${roleOption}"
                    th:text="${roleOption.displayName}">
            </option>

        </select>

        <p th:if="${#fields.hasErrors('role')}"
           th:errors="*{role}"></p>
    </div>

    <button type="submit">Register</button>

</form>

<p>
    Already have an account?
    <a th:href="@{/login}">Login</a>
</p>

</body>
</html>
