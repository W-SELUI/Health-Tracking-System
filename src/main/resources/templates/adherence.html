<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medication Adherence</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #eef2f7;
            color: #2c3e50;
        }

        .header {
            background: #dcecf9;
            padding: 35px 6%;
            border-bottom: 1px solid #d3e1ef;
        }

        .header h1 {
            color: #0d2d52;
            font-size: 42px;
            margin-bottom: 8px;
        }

        .header p {
            color: #183b63;
            font-size: 18px;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 40px auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .page-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .page-title h2 {
            color: #0d2d52;
            font-size: 32px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
            margin-bottom: 35px;
        }

        .stat-card {
            background: #f5f9fd;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid #e1eaf3;
        }

        .stat-card h3 {
            color: #0d2d52;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 36px;
            font-weight: bold;
            color: #1565a9;
            overflow-wrap: anywhere;
        }

        .adherence-card {
            background: #f5f9fd;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid #e1eaf3;
        }

        .adherence-card h3 {
            color: #0d2d52;
            margin-bottom: 15px;
            font-size: 22px;
        }

        .rate {
            font-size: 60px;
            font-weight: bold;
            color: #1565a9;
            overflow-wrap: anywhere;
        }

        .footer {
            text-align: center;
            margin-top: 35px;
        }

        .back-btn {
            display: inline-block;
            background: #344F6F;
            color: white;
            text-decoration: none;
            padding: 14px 25px;
            border-radius: 8px;
            font-weight: 600;
            transition: background 0.3s ease;
        }

        .back-btn:hover {
            background: #293F59;
        }

        @media (max-width: 700px) {
            .header {
                padding: 30px 6%;
            }

            .header h1 {
                font-size: 32px;
            }

            .container {
                width: 94%;
                margin: 25px auto;
                padding: 24px;
            }

            .page-title h2 {
                font-size: 26px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .rate {
                font-size: 46px;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Health Tracking System</h1>
        <p>Medication Adherence Monitoring</p>
    </div>

    <div class="container">

        <div class="page-title">
            <h2>📊 Medication Adherence Statistics</h2>
        </div>

        <div class="stats-grid">

            <div class="stat-card">
                <h3>Taken Doses</h3>
                <div class="value" th:text="${taken}">15</div>
            </div>

            <div class="stat-card">
                <h3>Missed Doses</h3>
                <div class="value" th:text="${missed}">2</div>
            </div>

            <div class="stat-card">
                <h3>Skipped Doses</h3>
                <div class="value" th:text="${skipped}">1</div>
            </div>

        </div>

        <div class="adherence-card">
            <h3>Current Adherence Rate</h3>
            <div class="rate" th:text="${adherenceRate} + '%'">
                85.5%
            </div>
        </div>

        <div class="footer">
            <a th:href="@{/medication-dashboard}" class="back-btn">
                &larr; Back to Medication Dashboard
            </a>
        </div>

    </div>

</body>
</html>
