<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Dose Record</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #eef2f7;
            color: #0d2d52;
        }

        header {
            background: #dcecf9;
            padding: 35px 6%;
            border-bottom: 1px solid #d3e1ef;
        }

        header h1 {
            font-size: 36px;
            margin-bottom: 10px;
            color: #0d2d52;
        }

        header p {
            font-size: 18px;
            color: #183b63;
        }

        .container {
            width: min(700px, 92%);
            margin: 40px auto;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        /* Dashboard navigation buttons */
        .dashboard-link {
            margin-bottom: 25px;
        }

        .dashboard-link a {
            display: inline-block;
            background: #344F6F;
            color: white;
            padding: 12px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            transition: background 0.3s ease;
        }

        .dashboard-link a:hover {
            background: #293F59;
        }

        h2 {
            font-size: 30px;
            margin-bottom: 12px;
            color: #0d2d52;
        }

        .description {
            color: #526477;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
            font-weight: 600;
            color: #0d2d52;
        }

        select,
        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cfd8e3;
            border-radius: 8px;
            background: white;
            font-size: 16px;
            color: #2c3e50;
        }

        select:focus,
        input:focus {
            outline: 2px solid #1565a9;
            border-color: #1565a9;
        }

        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 28px;
        }

        button,
        .cancel {
            display: inline-block;
            padding: 13px 22px;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-weight: 600;
            font-size: 16px;
            text-decoration: none;
            text-align: center;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        /* Update button remains blue */
        button {
            background: #1565a9;
            color: white;
        }

        button:hover {
            background: #0f4d84;
        }

        /* Cancel button matches the dashboard theme */
        .cancel {
            background: #344F6F;
            color: white;
        }

        .cancel:hover {
            background: #293F59;
        }

        .bottom-link {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #d9e3ec;
        }

        .bottom-link .dashboard-link {
            margin-bottom: 0;
        }

        @media (max-width: 600px) {
            header {
                padding: 30px 6%;
            }

            header h1 {
                font-size: 30px;
            }

            .container {
                margin: 25px auto;
                padding: 24px;
            }

            h2 {
                font-size: 26px;
            }

            .actions {
                flex-direction: column;
            }

            .actions button,
            .actions .cancel {
                width: 100%;
            }
        }
    </style>
    <link rel="stylesheet"
          href="/css/healthtrack-ui.css"
          data-th-href="@{/css/healthtrack-ui.css}">
</head>

<body class="healthtrack-ui medication-ui healthtrack-app-layout">
<div data-th-replace="~{fragments/navigation :: navigation('medication', 'Dose records')}"></div>
<div class="healthtrack-page-shell">

    <header>
        <h1>Health Tracking System</h1>
        <p>Dose Record Management</p>
    </header>

    <div class="container">

        <!-- Top dashboard navigation -->
        <div class="dashboard-link">
            <a th:href="@{/medication-dashboard}">
                &larr; Back to Medication Dashboard
            </a>
        </div>

        <h2>Edit Dose Record</h2>

        <p class="description">
            Update the selected medication, dose date, and status.
        </p>

        <form th:action="@{/dose-records/update/{id}(id=${doseRecord.id})}"
              th:object="${doseRecord}"
              method="post">

            <label for="medicationId">Medication</label>

            <select id="medicationId"
                    name="medicationId"
                    required>

                <option value="">-- Select medication --</option>

                <option th:each="med : ${medications}"
                        th:value="${med.id}"
                        th:text="${med.medicationName}"
                        th:selected="${doseRecord.medication != null and med.id == doseRecord.medication.id}">
                </option>

            </select>

            <label for="doseDate">Dose Date</label>

            <input type="date"
                   id="doseDate"
                   th:field="*{doseDate}"
                   required>

            <label for="status">Status</label>

            <select id="status"
                    th:field="*{status}"
                    required>

                <option value="">-- Select status --</option>

                <option th:each="s : ${statuses}"
                        th:value="${s}"
                        th:text="${s}">
                </option>

            </select>

            <div class="actions">

                <button type="submit">
                    Update Dose Record
                </button>

                <a class="cancel" th:href="@{/dose-records}">
                    Cancel
                </a>

            </div>

        </form>

        <!-- Bottom dashboard navigation -->
        <div class="bottom-link">
            <div class="dashboard-link">
                <a th:href="@{/medication-dashboard}">
                    &larr; Back to Medication Dashboard
                </a>
            </div>
        </div>

    </div>

</div>
</body>
</html>
