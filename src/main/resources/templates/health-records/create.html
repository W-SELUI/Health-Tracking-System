<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Health Record</title>
    <link rel="stylesheet"
          href="/css/app.css"
          data-th-href="@{/css/app.css}">
    <link rel="stylesheet"
          href="/css/healthtrack-ui.css"
          data-th-href="@{/css/healthtrack-ui.css}">
</head>
<body class="healthtrack-ui records-ui">
<header class="healthtrack-global-header">
    <div class="healthtrack-global-inner">
        <a class="healthtrack-global-brand"
           href="/dashboard"
           data-th-href="@{/dashboard}">
            <span class="healthtrack-global-mark">
                <img src="/images/heart-pulse.svg"
                     data-th-src="@{/images/heart-pulse.svg}"
                     alt="">
            </span>
            <span>
                <span class="healthtrack-global-name">HealthTrack</span>
                <span class="healthtrack-global-tagline">Your health, clearly</span>
            </span>
        </a>
        <span class="healthtrack-global-section">Health records</span>
    </div>
</header>
<div class="healthtrack-page-shell">

<h1>Add Health Record</h1>

<form th:action="@{/patient/health-records}"
      th:object="${healthRecordCreateRequest}"
      method="post">

    <div>
        <label for="metricType">Health Metric</label>

        <select id="metricType"
                th:field="*{metricType}"
                required>

            <option value="">Select a metric</option>

            <option th:each="option : ${metricOptions}"
                    th:value="${option}"
                    th:text="${option.displayName}">
                Metric
            </option>

        </select>

        <p th:if="${#fields.hasErrors('metricType')}"
           th:errors="*{metricType}">
            Metric error
        </p>
    </div>

    <div id="scalarValueGroup">
        <label for="metricValue">Measurement Value</label>

        <input type="number"
               id="metricValue"
               th:field="*{metricValue}"
               step="0.001">

        <p th:if="${#fields.hasErrors('metricValue')}"
           th:errors="*{metricValue}">
            Measurement error
        </p>
    </div>

    <div id="bloodPressureGroup">

        <p>
            Enter systolic and diastolic values from the same blood-pressure reading.
        </p>

        <div>
            <label for="systolic">Systolic (mmHg)</label>

            <input type="number"
                   id="systolic"
                   th:field="*{systolic}"
                   step="0.1">

            <p th:if="${#fields.hasErrors('systolic')}"
               th:errors="*{systolic}">
                Systolic error
            </p>
        </div>

        <div>
            <label for="diastolic">Diastolic (mmHg)</label>

            <input type="number"
                   id="diastolic"
                   th:field="*{diastolic}"
                   step="0.1">

            <p th:if="${#fields.hasErrors('diastolic')}"
               th:errors="*{diastolic}">
                Diastolic error
            </p>
        </div>

    </div>

    <div>
        <label for="observedAt">
            Observation Date and Time
        </label>

        <input type="datetime-local"
               id="observedAt"
               th:field="*{observedAt}"
               step="60"
               required>

        <p th:if="${#fields.hasErrors('observedAt')}"
           th:errors="*{observedAt}">
            Observation time error
        </p>
    </div>

    <div>
        <label for="notes">Notes</label>

        <textarea id="notes"
                  th:field="*{notes}"
                  rows="4"
                  maxlength="1000"></textarea>

        <p th:if="${#fields.hasErrors('notes')}"
           th:errors="*{notes}">
            Notes error
        </p>
    </div>

    <button type="submit">
        Save Health Record
    </button>

</form>

<p>
    <a th:href="@{/patient/health-records}">
        Cancel
    </a>
</p>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const metricType = document.getElementById("metricType");
        const scalarValueGroup = document.getElementById("scalarValueGroup");
        const bloodPressureGroup = document.getElementById("bloodPressureGroup");
        const metricValue = document.getElementById("metricValue");
        const systolic = document.getElementById("systolic");
        const diastolic = document.getElementById("diastolic");

        function updateMeasurementFields() {
            const selectedMetric = metricType.value;
            const isBloodPressure = selectedMetric === "BLOOD_PRESSURE";
            const hasSelection = selectedMetric !== "";

            scalarValueGroup.hidden = !hasSelection || isBloodPressure;
            bloodPressureGroup.hidden = !isBloodPressure;

            metricValue.required = hasSelection && !isBloodPressure;
            systolic.required = isBloodPressure;
            diastolic.required = isBloodPressure;
        }

        metricType.addEventListener("change", updateMeasurementFields);
        updateMeasurementFields();
    });
</script>

</div>
</body>
</html>
