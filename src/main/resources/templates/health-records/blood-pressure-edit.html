<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Blood Pressure</title>
    <link rel="stylesheet"
          href="/css/app.css"
          data-th-href="@{/css/app.css}">
</head>
<body>

<h1>Edit Blood Pressure</h1>

<p>
    Systolic and diastolic belong to the same observation.
</p>

<form th:action="@{/patient/health-records/blood-pressure/{id}/edit(id=${recordId})}"
      th:object="${bloodPressureRequest}"
      method="post">

    <div>
        <label for="systolic">Systolic (mmHg)</label>

        <input type="number"
               id="systolic"
               th:field="*{systolic}"
               step="0.1"
               required>

        <p th:if="${#fields.hasErrors('systolic')}"
           th:errors="*{systolic}">
            Systolic error
        </p>
    </div>

    <div>
        <label for="diastolic">Diastolic (mmHg)</label>

        <input type="number"
               id="diastolic"
               th:field="*{diastolic}"
               step="0.1"
               required>

        <p th:if="${#fields.hasErrors('diastolic')}"
           th:errors="*{diastolic}">
            Diastolic error
        </p>
    </div>

    <div>
        <label for="observedAt">
            Observation Date and Time
        </label>

        <input type="datetime-local"
               id="observedAt"
               th:field="*{observedAt}"
               step="60"
               required>

        <p th:if="${#fields.hasErrors('observedAt')}"
           th:errors="*{observedAt}">
            Observation time error
        </p>
    </div>

    <div>
        <label for="notes">Notes</label>

        <textarea id="notes"
                  th:field="*{notes}"
                  rows="4"
                  maxlength="1000"></textarea>

        <p th:if="${#fields.hasErrors('notes')}"
           th:errors="*{notes}">
            Notes error
        </p>
    </div>

    <button type="submit">
        Save Changes
    </button>

</form>

<p>
    <a th:href="@{/patient/health-records}">
        Cancel
    </a>
</p>

</body>
</html>
