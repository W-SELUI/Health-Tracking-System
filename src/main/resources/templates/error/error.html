<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${error}">Error</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet"
          href="/css/healthtrack-ui.css"
          data-th-href="@{/css/healthtrack-ui.css}">
</head>
<body class="healthtrack-ui error-ui">
<header class="healthtrack-global-header">
    <div class="healthtrack-global-inner">
        <a class="healthtrack-global-brand"
           href="/dashboard"
           data-th-href="@{/dashboard}">
            <span class="healthtrack-global-mark">
                <img src="/images/heart-pulse.svg"
                     data-th-src="@{/images/heart-pulse.svg}"
                     alt="">
            </span>
            <span>
                <span class="healthtrack-global-name">HealthTrack</span>
                <span class="healthtrack-global-tagline">Your health, clearly</span>
            </span>
        </a>
        <span class="healthtrack-global-section">System notice</span>
    </div>
</header>
<div class="healthtrack-page-shell">

<h1 th:text="${error}">Error</h1>

<p>
    Status:
    <span th:text="${status}">500</span>
</p>

<p th:text="${message}">
    An unexpected error occurred.
</p>

<a th:href="@{/dashboard}">Return to Dashboard</a>

</div>
</body>
</html>
