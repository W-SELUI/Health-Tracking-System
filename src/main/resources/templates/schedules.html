<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medication Schedules</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #eef2f7;
            color: #0d2d52;
        }

        .header {
            background: #dcecf9;
            padding: 35px 6%;
            border-bottom: 1px solid #d3e1ef;
        }

        .header h1 {
            font-size: 42px;
            font-weight: 700;
            color: #0d2d52;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 18px;
            color: #183b63;
        }

        .container {
            width: 88%;
            max-width: 1400px;
            margin: 40px auto;
            background: white;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .dashboard-link {
            margin-bottom: 25px;
        }

        /* Dashboard navigation button */
        .dashboard-link a {
            display: inline-block;
            text-decoration: none;
            color: white;
            background: #344F6F;
            padding: 11px 20px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            transition: background 0.3s;
        }

        .dashboard-link a:hover {
            background: #293F59;
        }

        .page-title {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .page-title h2 {
            font-size: 32px;
            color: #0d2d52;
        }

        .schedule-icon {
            font-size: 36px;
        }

        .top-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 35px;
        }

        .stats-card {
            width: 250px;
            background: #f5f9fd;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .stats-card h3 {
            font-size: 16px;
            color: #0d2d52;
            margin-bottom: 12px;
        }

        .stats-card .number {
            font-size: 36px;
            font-weight: bold;
            color: #1565a9;
        }

        .add-btn {
            display: inline-block;
            background: #1565a9;
            color: white;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.3s;
        }

        .add-btn:hover {
            background: #0f4d84;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
            border: 1px solid #d9e3ec;
            border-radius: 15px;
        }

        table {
            width: 100%;
            min-width: 600px;
            border-collapse: collapse;
        }

        th {
            background: #dce7f2;
            color: #0d2d52;
            padding: 18px;
            text-align: center;
            font-size: 16px;
        }

        td {
            padding: 18px;
            border-bottom: 1px solid #e1e8ef;
            text-align: center;
            font-size: 15px;
        }

        tbody tr:hover {
            background: #f7fbff;
        }

        .edit-btn,
        .delete-btn {
            display: inline-block;
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.3s;
        }

        .edit-btn {
            background: #1565a9;
        }

        .edit-btn:hover {
            background: #0f4d84;
        }

        /* Dark blue-grey Delete button */
        .delete-btn {
            background: #344F6F;
        }

        .delete-btn:hover {
            background: #293F59;
        }

        .empty-row td {
            padding: 30px;
            color: #7f8c8d;
            font-style: italic;
            text-align: center;
        }

        .footer {
            text-align: center;
            margin-top: 35px;
        }

        /* Bottom dashboard navigation button */
        .back-btn {
            display: inline-block;
            background: #344F6F;
            color: white;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.3s;
        }

        .back-btn:hover {
            background: #293F59;
        }

        @media (max-width: 768px) {
            .header {
                padding: 30px 6%;
            }

            .header h1 {
                font-size: 32px;
            }

            .header p {
                font-size: 16px;
            }

            .container {
                width: 94%;
                margin: 25px auto;
                padding: 22px;
            }

            .page-title h2 {
                font-size: 26px;
            }

            .top-section {
                flex-direction: column;
                align-items: stretch;
            }

            .stats-card {
                width: 100%;
            }

            .add-btn {
                text-align: center;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 16px;
            }

            .page-title h2 {
                font-size: 22px;
            }

            .schedule-icon {
                font-size: 28px;
            }

            .dashboard-link a,
            .back-btn {
                text-align: center;
                width: 100%;
            }

            th,
            td {
                padding: 12px;
            }
        }
    </style>
</head>

<body>

<div class="header">
    <h1>Health Tracking System</h1>
    <p>Medication Schedule Management</p>
</div>

<div class="container">

    <div class="dashboard-link">
        <a th:href="@{/medication-dashboard}">
            ← Back to Medication Dashboard
        </a>
    </div>

    <div class="page-title">
        <span class="schedule-icon">⏰</span>
        <h2>Medication Schedules</h2>
    </div>

    <div class="top-section">

        <div class="stats-card">
            <h3>Total Schedules</h3>
            <div class="number" th:text="${schedules.size()}">0</div>
        </div>

        <a th:href="@{/schedules/add}" class="add-btn">
            + Add Schedule
        </a>

    </div>

    <div class="table-container">
        <table>

            <thead>
            <tr>
                <th>ID</th>
                <th>Scheduled Time</th>
                <th>Edit</th>
                <th>Delete</th>
            </tr>
            </thead>

            <tbody>

            <tr th:if="${#lists.isEmpty(schedules)}" class="empty-row">
                <td colspan="4">
                    No schedules found. Click "Add Schedule" to create your first schedule.
                </td>
            </tr>

            <tr th:each="schedule : ${schedules}">

                <td th:text="${schedule.id}"></td>

                <td th:text="${schedule.scheduledTime}"></td>

                <td>
                    <a th:href="@{'/schedules/edit/' + ${schedule.id}}"
                       class="edit-btn">
                        Edit
                    </a>
                </td>

                <td>
                    <a th:href="@{'/schedules/delete/' + ${schedule.id}}"
                       class="delete-btn"
                       onclick="return confirm('Delete this schedule?');">
                        Delete
                    </a>
                </td>

            </tr>

            </tbody>

        </table>
    </div>

    <div class="footer">
        <a th:href="@{/medication-dashboard}" class="back-btn">
            ← Back to Medication Dashboard
        </a>
    </div>

</div>

</body>
</html>
