<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Appointment | Health Tracking System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #edf2f8;
            color: #12345a;
            min-height: 100vh;
        }

        .header {
            background: #dcecf9;
            padding: 35px 5.5%;
            border-bottom: 1px solid #d1e2f1;
        }

        .header h1 {
            margin-bottom: 8px;
            font-size: 38px;
            font-weight: 750;
        }

        .header p {
            color: #31577e;
            font-size: 17px;
        }

        .container {
            max-width: 1000px;
            margin: 35px auto;
            padding: 0 22px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
            padding: 12px 18px;
            background: #344F6F;
            border: 1px solid #344F6F;
            border-radius: 8px;
            color: #ffffff;
            text-decoration: none;
            font-size: 15px;
            font-weight: 650;
            transition: background 0.2s ease;
        }

        .back-link:hover {
            background: #293F59;
            border-color: #293F59;
        }

        .card {
            max-width: 760px;
            margin: 0 auto;
            padding: 38px 44px;
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(28, 55, 85, 0.10);
        }

        h2 {
            text-align: center;
            font-size: 30px;
            margin-bottom: 32px;
            color: #12345a;
        }

        .group {
            margin-bottom: 23px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #183b63;
            font-weight: 700;
            font-size: 16px;
        }

        input,
        select,
        textarea {
            display: block;
            width: 100%;
            min-height: 52px;
            padding: 13px 15px;
            font-family: inherit;
            font-size: 16px;
            color: #183b63;
            background: #e8f0fe;
            border: 1px solid #d1d9e4;
            border-radius: 10px;
            outline: none;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        input[type="datetime-local"] {
            background: #ffffff;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #1769aa;
            box-shadow: 0 0 0 3px rgba(23, 105, 170, 0.12);
        }

        .button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 52px;
            padding: 14px 20px;
            margin-top: 16px;
            border: none;
            border-radius: 9px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .save {
            background: #1769aa;
            color: #ffffff;
        }

        .save:hover {
            background: #12558b;
        }

        .cancel {
            background: #344F6F;
            color: #ffffff;
        }

        .cancel:hover {
            background: #293F59;
        }

        .footer {
            display: flex;
            justify-content: center;
            margin: 26px 0 35px;
        }

        .footer .button {
            width: auto;
            padding: 14px 24px;
        }

        @media (max-width: 600px) {
            .header {
                padding: 28px 22px;
            }

            .header h1 {
                font-size: 29px;
            }

            .container {
                padding: 0 14px;
            }

            .card {
                padding: 28px 22px;
            }

            h2 {
                font-size: 26px;
            }

            .footer .button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header class="header">
    <h1>Health Tracking System</h1>
    <p>Appointment Management</p>
</header>

<main class="container">

    <a class="back-link" th:href="@{/medication-dashboard}">
        &larr; Back to Medication Dashboard
    </a>

    <section class="card">

        <h2>✏️ Edit Appointment Request</h2>

        <form th:action="@{/appointments/update/{id}(id=${appointment.id})}"
              method="post">

            <div class="group">
                <label for="providerId">Doctor Name</label>

                <select
                    id="providerId"
                    name="providerId"
                    required>

                    <option value="">
                        -- Select a registered doctor --
                    </option>

                    <option
                        th:each="doctor : ${doctors}"
                        th:value="${doctor.id}"
                        th:text="${doctor.fullName + ' (' + doctor.email + ')'}"
                        th:selected="${appointment.provider != null
                            and doctor.id == appointment.provider.id}">
                    </option>

                </select>
            </div>

            <div class="group">
                <label for="location">Location</label>

                <input
                    type="text"
                    id="location"
                    name="location"
                    th:value="${appointment.location}"
                    maxlength="255"
                    required>
            </div>

            <div class="group">
                <label for="purpose">Purpose</label>

                <textarea
                    id="purpose"
                    name="purpose"
                    maxlength="500"
                    placeholder="Briefly describe the reason for the appointment"
                    th:text="${appointment.purpose}"
                    required></textarea>
            </div>

            <div class="group">
                <label for="appointmentDateTime">Date &amp; Time</label>

                <input
                    type="datetime-local"
                    id="appointmentDateTime"
                    name="appointmentDateTime"
                    th:value="${appointmentDateTime}"
                    required>
            </div>

            <button class="button save"
                    type="submit">
                Update Appointment Request
            </button>

            <a class="button cancel"
               th:href="@{/appointments}">
                Cancel
            </a>

        </form>

    </section>

    <div class="footer">
        <a class="button cancel"
           th:href="@{/medication-dashboard}">
            &larr; Back to Medication Dashboard
        </a>
    </div>

</main>

</body>
</html>
